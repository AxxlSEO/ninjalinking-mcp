name: Release npm

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run smoke:pack
      # Publication via Trusted Publishing (OIDC GitHub Actions, aucun token) :
      # configuré sur npmjs.com → package ninjalinking-mcp → Settings →
      # Trusted Publisher (repo AxxlSEO/ninjalinking-mcp, workflow release.yml).
      # Nécessite npm >= 11.5.1 (Node 22 embarque npm 10, d'où l'upgrade).
      - run: npm install -g npm@latest
      - run: npm publish --access public --provenance
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
